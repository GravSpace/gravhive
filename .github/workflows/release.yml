name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Cross (if cross-compiling)
        if: ${{ matrix.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Release Assets
        shell: bash
        run: |
          RELEASE_DIR="gravhive-${{ matrix.target }}"
          mkdir -p "$RELEASE_DIR/scripts"

          # Copy binaries
          cp "target/${{ matrix.target }}/release/ghive" "$RELEASE_DIR/"
          cp "target/${{ matrix.target }}/release/ghived" "$RELEASE_DIR/"

          # Copy installers and documentation
          cp install.sh "$RELEASE_DIR/"
          cp scripts/* "$RELEASE_DIR/scripts/" 2>/dev/null || true
          cp README.md "$RELEASE_DIR/"
          cp LICENSE "$RELEASE_DIR/"

          # Archive
          ARCHIVE_NAME="gravhive-${{ matrix.target }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" "$RELEASE_DIR"

          # Checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravhive-${{ matrix.target }}
          path: |
            gravhive-${{ matrix.target }}.tar.gz
            gravhive-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate Artifacts & Checksums
        shell: bash
        run: |
          mkdir -p release_assets
          cd artifacts
          find . -name "*.tar.gz" -exec cp {} ../release_assets/ \;
          find . -name "*.sha256" -exec cat {} + > ../release_assets/SHA256SUMS.txt
          cd ..
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

