[package]
name = "gravhive"
version = "0.3.0"
edition = "2021"
authors = ["Gravhive Team"]
description = "Next-Generation High-Performance Production Process Manager in Rust"

[lib]
name = "gravhive"
path = "src/lib.rs"

[[bin]]
name = "ghive"
path = "src/bin/ghive.rs"

[[bin]]
name = "ghived"
path = "src/bin/ghived.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
notify = "8.0"
notify-debouncer-mini = "0.6"
sysinfo = "0.33"
comfy-table = "7.1"
ratatui = "0.29"
crossterm = "0.28"
nix = { version = "0.29", features = ["signal", "process", "user", "resource"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glob = "0.3"
colored = "2.2"
dirs = "6.0"
bytes = "1.10"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
cron = "0.17.0"
wasmi = "2.0.0"
aes-gcm = "0.11.1"
inferno = { version = "0.12.8", default-features = false }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

